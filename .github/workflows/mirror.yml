name: mirror
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Accept a large drop in merchants
        type: boolean
        default: false
permissions:
  contents: write
concurrency: mirror
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/mirror.py
        env:
          FORCE: ${{ inputs.force }}
      - name: Commit
        run: |
          git add docs
          # GitHub stops scheduled workflows after 60 quiet days; a monthly heartbeat keeps this one alive.
          if git diff --cached --quiet; then
            last=$(git log -1 --format=%ct)
            [ $(( $(date +%s) - last )) -gt 2592000 ] || exit 0
            date -u +%FT%TZ > heartbeat && git add heartbeat
          fi
          git -c user.name=neptune-logos-mirror -c user.email=logos@neptune.ly commit -qm "mirror $(date -u +%FT%TZ)"
          git push
